<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Aladiah Academy — Mono Mark">
  <title>Aladiah Academy Mono Mark</title>
  <desc>Single-colour version of the primary mark for use on solid backgrounds. White on transparent. Do not alter.</desc>

  <!-- Mono: all elements in white/cream, no background, for placement on coloured surfaces -->

  <!-- Torch head -->
  <path d="M 73 90 L 73 60 Q 73 33 100 31 Q 127 33 127 60 L 127 90 Z"
        fill="#F2E6C9"/>

  <!-- Panel bands -->
  <rect x="73" y="73" width="54" height="2.5" rx="1" fill="#0E1F44" opacity="0.2"/>
  <rect x="73" y="81" width="54" height="2"   rx="1" fill="#0E1F44" opacity="0.15"/>

  <!-- Collar -->
  <rect x="82" y="88" width="36" height="7" rx="3.5" fill="#F2E6C9"/>

  <!-- Shaft -->
  <rect x="91" y="95" width="18" height="50" rx="2" fill="#F2E6C9"/>

  <!-- Mid band -->
  <rect x="88" y="116" width="24" height="2.5" rx="1" fill="#0E1F44" opacity="0.2"/>

  <!-- Lower collar -->
  <rect x="87" y="143" width="26" height="4" rx="2" fill="#F2E6C9"/>

  <!-- Base flare -->
  <path d="M 81 151 L 87 143 L 113 143 L 119 151 Q 100 157 81 151 Z" fill="#F2E6C9"/>

  <!-- Hidden 9 circle -->
  <circle cx="100" cy="61" r="21" fill="none" stroke="#F2E6C9" stroke-width="3.8"/>

  <!-- Hidden 9 tail -->
  <path d="M 121 61 L 121 88" fill="none" stroke="#F2E6C9" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Flame tip -->
  <path d="M 93 33 Q 100 18 107 33" fill="none" stroke="#F2E6C9" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Global arc primary -->
  <path d="M 44 155 Q 100 132 156 155" fill="none" stroke="#F2E6C9" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Global arc echo -->
  <path d="M 54 162 Q 100 142 146 162" fill="none" stroke="#F2E6C9" stroke-width="1.4" stroke-linecap="round" opacity="0.4"/>
</svg>

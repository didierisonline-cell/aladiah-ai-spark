<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="Aladiah Academy">
  <defs>
    <linearGradient id="mkS" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/><stop offset="1" stop-color="#9FB2CE"/>
    </linearGradient>
    <linearGradient id="mkSr" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#C8D4E6"/><stop offset="1" stop-color="#6E82A6"/>
    </linearGradient>
    <linearGradient id="mkG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D27A"/><stop offset="1" stop-color="#C8902E"/>
    </linearGradient>
    <linearGradient id="mkFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE6A6"/><stop offset="1" stop-color="#D89A33"/>
    </linearGradient>
    <linearGradient id="mkCrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8425C"/><stop offset="1" stop-color="#8E1B2E"/>
    </linearGradient>
    <clipPath id="mkGlobe"><rect x="18" y="100" width="84" height="40"/></clipPath>
  </defs>

  <!-- Globe: subtle navy cap, a few faint gold dots, single quiet swoosh -->
  <g clip-path="url(#mkGlobe)">
    <circle cx="60" cy="134" r="40" fill="#0C1730" stroke="#33518A" stroke-width="1"/>
    <g fill="#C9A24B" opacity="0.4">
      <circle cx="46" cy="107" r="1.2"/><circle cx="54" cy="105" r="1.2"/><circle cx="62" cy="106" r="1.2"/>
      <circle cx="70" cy="105" r="1.2"/><circle cx="50" cy="111" r="1.2"/><circle cx="66" cy="111" r="1.2"/>
      <circle cx="58" cy="112" r="1.2"/>
    </g>
  </g>
  <path d="M20 100 Q60 113 100 100" stroke="url(#mkG)" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- Silver A-spire (left lit, right shaded) -->
  <polygon points="26,99 56,30 63,32 45,99" fill="url(#mkS)"/>
  <polygon points="94,99 64,30 57,32 75,99" fill="url(#mkSr)"/>

  <!-- Torch of knowledge: slim gold handle, luminous gold flame, crimson heart -->
  <polygon points="58,74 62,74 61,96 59,96" fill="url(#mkG)"/>
  <path d="M60 46 C63.5 54 65 60 64 66 C63 71 61 75 60 76 C59 75 57 71 56 66 C55 60 56.5 54 60 46 Z" fill="url(#mkFlame)"/>
  <path d="M60 54 C62 59 63 63 62 67 C61.3 70 60.6 72 60 73 C59.4 72 58.7 70 58 67 C57 63 58 59 60 54 Z" fill="url(#mkCrim)"/>

  <!-- Hidden 9 at the apex: a single intentional curl -->
  <path d="M58.5 30 C61.5 28.5 64.5 25.5 64.5 20 A5.5 5.5 0 1 0 58.8 14.8"
        fill="none" stroke="url(#mkG)" stroke-width="3.2" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 138" role="img" aria-label="Aladiah Academy">
  <defs>
    <linearGradient id="mkS" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/><stop offset="1" stop-color="#9FB2CE"/>
    </linearGradient>
    <linearGradient id="mkSr" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#C8D4E6"/><stop offset="1" stop-color="#6E82A6"/>
    </linearGradient>
    <linearGradient id="mkG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D27A"/><stop offset="1" stop-color="#C8902E"/>
    </linearGradient>
    <radialGradient id="mkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3E7BD6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3E7BD6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mkGlobe"><rect x="18" y="100" width="84" height="40"/></clipPath>
  </defs>

  <!-- globe glow + body at base -->
  <ellipse cx="60" cy="104" rx="44" ry="18" fill="url(#mkGlow)"/>
  <g clip-path="url(#mkGlobe)">
    <circle cx="60" cy="132" r="38" fill="#0C1730" stroke="#2C56A0" stroke-width="1.2"/>
    <g fill="#4E8AE0">
      <circle cx="44" cy="106" r="1.3"/><circle cx="50" cy="104" r="1.3"/><circle cx="56" cy="106" r="1.3"/>
      <circle cx="63" cy="104" r="1.3"/><circle cx="70" cy="106" r="1.3"/><circle cx="76" cy="105" r="1.3"/>
      <circle cx="40" cy="110" r="1.3"/><circle cx="47" cy="111" r="1.3"/><circle cx="54" cy="110" r="1.3"/>
      <circle cx="66" cy="111" r="1.3"/><circle cx="73" cy="110" r="1.3"/><circle cx="80" cy="111" r="1.3"/>
      <circle cx="58" cy="113" r="1.3"/><circle cx="51" cy="115" r="1.3"/><circle cx="69" cy="115" r="1.3"/>
    </g>
  </g>

  <!-- gold base swoosh -->
  <path d="M16 100 Q60 116 104 100" stroke="url(#mkG)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- silver A blades (left lit, right shaded for a faceted look) -->
  <polygon points="26,99 56,30 63,32 45,99" fill="url(#mkS)"/>
  <polygon points="94,99 64,30 57,32 75,99" fill="url(#mkSr)"/>

  <!-- gold central spear -->
  <polygon points="60,40 73,62 60,53 47,62" fill="url(#mkG)"/>
  <rect x="57.6" y="50" width="4.8" height="49" fill="url(#mkG)"/>

  <!-- gold spiral peak -->
  <path d="M60 32 C57 18 73 11 70 25 C68 33 58 31 61 23"
        fill="none" stroke="url(#mkG)" stroke-width="3.6" stroke-linecap="round"/>
</svg>

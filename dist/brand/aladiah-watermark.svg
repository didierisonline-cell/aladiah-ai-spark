<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="Aladiah Academy emblem">
  <!-- Blue/gold watermark variant of the Aladiah emblem (no crimson, no silver).
       For low-opacity background use behind hero content. -->
  <defs>
    <linearGradient id="wmBlue" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#8FC0FF"/><stop offset="1" stop-color="#2A5FB8"/>
    </linearGradient>
    <linearGradient id="wmBlueDark" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#5E97E6"/><stop offset="1" stop-color="#1B3E82"/>
    </linearGradient>
    <linearGradient id="wmGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D27A"/><stop offset="1" stop-color="#C8902E"/>
    </linearGradient>
    <linearGradient id="wmFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE6A6"/><stop offset="1" stop-color="#D89A33"/>
    </linearGradient>
    <clipPath id="wmGlobe"><rect x="18" y="100" width="84" height="40"/></clipPath>
  </defs>

  <!-- World globe arc (blue) -->
  <g clip-path="url(#wmGlobe)">
    <circle cx="60" cy="134" r="40" fill="#0C1730" stroke="#3E7BD6" stroke-width="1"/>
    <g fill="#5E97E6" opacity="0.5">
      <circle cx="46" cy="107" r="1.2"/><circle cx="54" cy="105" r="1.2"/><circle cx="62" cy="106" r="1.2"/>
      <circle cx="70" cy="105" r="1.2"/><circle cx="50" cy="111" r="1.2"/><circle cx="66" cy="111" r="1.2"/>
      <circle cx="58" cy="112" r="1.2"/>
    </g>
  </g>
  <path d="M20 100 Q60 113 100 100" stroke="url(#wmGold)" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- Spire A (blue) -->
  <polygon points="26,99 56,30 63,32 45,99" fill="url(#wmBlue)"/>
  <polygon points="94,99 64,30 57,32 75,99" fill="url(#wmBlueDark)"/>

  <!-- Torch of knowledge (gold only — crimson removed) -->
  <polygon points="58,74 62,74 61,96 59,96" fill="url(#wmGold)"/>
  <path d="M60 46 C63.5 54 65 60 64 66 C63 71 61 75 60 76 C59 75 57 71 56 66 C55 60 56.5 54 60 46 Z" fill="url(#wmFlame)"/>

  <!-- Hidden 9 (gold) -->
  <path d="M58.5 30 C61.5 28.5 64.5 25.5 64.5 20 A5.5 5.5 0 1 0 58.8 14.8"
        fill="none" stroke="url(#wmGold)" stroke-width="3.2" stroke-linecap="round"/>
</svg>

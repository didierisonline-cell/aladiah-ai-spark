[functions.send-welcome-email]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false

[functions.handle-payment-webhook]
verify_jwt = false

[functions.send-email]
enabled = true
verify_jwt = true
import_map = "./functions/send-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-email/*.html" ]

# recompute-learning-profiles: verify_jwt=true. Cron (drain/sweep) authenticates with the
# publishable/anon JWT bearer; the function's DB privilege comes from SUPABASE_DB_URL, not
# the caller. Strict service-role-only rejection deferred (see PHASE2_ANALYTICS_PLAN.md S4 auth).
[functions.recompute-learning-profiles]
verify_jwt = true

# Quiz integrity (answer-key removal): students must be authenticated to load
# questions or submit. get-quiz-questions strips answers + explanations;
# submit-quiz grades server-side and owns all quiz writes.
[functions.get-quiz-questions]
verify_jwt = true

[functions.submit-quiz]
verify_jwt = true

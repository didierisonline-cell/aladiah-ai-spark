<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="700" fill="#0B111E"/>

  <!-- Title -->
  <text x="440" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#EDF2F7" letter-spacing="-0.3">Digital Trust Stack</text>
  <text x="440" y="70" text-anchor="middle" font-size="13" fill="#8596AD">Enterprise trust is built layer by layer</text>

  <!-- ─── LAYER DEFINITIONS ─── -->
  <!-- Layer height: 68px, gap: 8px, stack from bottom. Starting y for layer 1 bottom = 596, top = 528 -->
  <!-- Layer 1 y=528, Layer 2 y=452, Layer 3 y=376, Layer 4 y=300, Layer 5 y=224, Layer 6 y=148 -->

  <!-- LAYER 1: Technical Security (blue border) -->
  <rect x="42" y="528" width="612" height="68" rx="10" fill="#111D30" stroke="#4A90F5" stroke-width="2"/>
  <!-- Left accent bar -->
  <rect x="42" y="528" width="5" height="68" rx="2" fill="#4A90F5"/>
  <!-- Layer number -->
  <text x="68" y="557" text-anchor="middle" font-size="11" fill="#4A90F5" font-weight="700">01</text>
  <text x="68" y="573" text-anchor="middle" font-size="10" fill="#4A90F5">BASE</text>
  <!-- Layer name -->
  <text x="104" y="556" font-size="16" font-weight="700" fill="#EDF2F7">Technical Security</text>
  <!-- Description -->
  <text x="104" y="578" font-size="12" fill="#8596AD">Encryption · PKI · Network Controls · Firewall · TLS</text>
  <!-- Right badge -->
  <rect x="554" y="542" width="90" height="24" rx="12" fill="#0D1B3E" stroke="#4A90F5" stroke-width="1"/>
  <text x="599" y="558" text-anchor="middle" font-size="11" fill="#4A90F5" font-weight="600">FOUNDATION</text>

  <!-- LAYER 2: Identity & Access (blue border) -->
  <rect x="42" y="452" width="612" height="68" rx="10" fill="#111D30" stroke="#4A90F5" stroke-width="2"/>
  <rect x="42" y="452" width="5" height="68" rx="2" fill="#4A90F5"/>
  <text x="68" y="481" text-anchor="middle" font-size="11" fill="#4A90F5" font-weight="700">02</text>
  <text x="68" y="497" text-anchor="middle" font-size="10" fill="#4A90F5">LAYER</text>
  <text x="104" y="480" font-size="16" font-weight="700" fill="#EDF2F7">Identity &amp; Access</text>
  <text x="104" y="502" font-size="12" fill="#8596AD">IAM · MFA · Zero Trust · RBAC · SSO · PAM</text>
  <rect x="554" y="466" width="90" height="24" rx="12" fill="#0D1B3E" stroke="#4A90F5" stroke-width="1"/>
  <text x="599" y="482" text-anchor="middle" font-size="11" fill="#4A90F5" font-weight="600">IDENTITY</text>

  <!-- LAYER 3: Data Privacy (green border) -->
  <rect x="42" y="376" width="612" height="68" rx="10" fill="#111D30" stroke="#22C98A" stroke-width="2"/>
  <rect x="42" y="376" width="5" height="68" rx="2" fill="#22C98A"/>
  <text x="68" y="405" text-anchor="middle" font-size="11" fill="#22C98A" font-weight="700">03</text>
  <text x="68" y="421" text-anchor="middle" font-size="10" fill="#22C98A">LAYER</text>
  <text x="104" y="404" font-size="16" font-weight="700" fill="#EDF2F7">Data Privacy</text>
  <text x="104" y="426" font-size="12" fill="#8596AD">GDPR · CCPA · Data Classification · DLP · Tokenization</text>
  <rect x="554" y="390" width="90" height="24" rx="12" fill="#0D1F14" stroke="#22C98A" stroke-width="1"/>
  <text x="599" y="406" text-anchor="middle" font-size="11" fill="#22C98A" font-weight="600">PRIVACY</text>

  <!-- LAYER 4: Compliance & Audit (green border) -->
  <rect x="42" y="300" width="612" height="68" rx="10" fill="#111D30" stroke="#22C98A" stroke-width="2"/>
  <rect x="42" y="300" width="5" height="68" rx="2" fill="#22C98A"/>
  <text x="68" y="329" text-anchor="middle" font-size="11" fill="#22C98A" font-weight="700">04</text>
  <text x="68" y="345" text-anchor="middle" font-size="10" fill="#22C98A">LAYER</text>
  <text x="104" y="328" font-size="16" font-weight="700" fill="#EDF2F7">Compliance &amp; Audit</text>
  <text x="104" y="350" font-size="12" fill="#8596AD">SOC 2 · ISO 27001 · PCI-DSS · Audit Trails · NIST</text>
  <rect x="554" y="314" width="90" height="24" rx="12" fill="#0D1F14" stroke="#22C98A" stroke-width="1"/>
  <text x="599" y="330" text-anchor="middle" font-size="11" fill="#22C98A" font-weight="600">ASSURANCE</text>

  <!-- LAYER 5: AI Governance (orange border) -->
  <rect x="42" y="224" width="612" height="68" rx="10" fill="#111D30" stroke="#F0622A" stroke-width="2"/>
  <rect x="42" y="224" width="5" height="68" rx="2" fill="#F0622A"/>
  <text x="68" y="253" text-anchor="middle" font-size="11" fill="#F0622A" font-weight="700">05</text>
  <text x="68" y="269" text-anchor="middle" font-size="10" fill="#F0622A">LAYER</text>
  <text x="104" y="252" font-size="16" font-weight="700" fill="#EDF2F7">AI Governance</text>
  <text x="104" y="274" font-size="12" fill="#8596AD">Model Risk · Bias Auditing · AI Ethics · Explainability · RED Teams</text>
  <rect x="536" y="238" width="108" height="24" rx="12" fill="#1A110A" stroke="#F0622A" stroke-width="1"/>
  <text x="590" y="254" text-anchor="middle" font-size="11" fill="#F0622A" font-weight="600">AI GOVERNANCE</text>

  <!-- LAYER 6: Digital Trust (gold border, gold tint) -->
  <rect x="42" y="148" width="612" height="68" rx="10" fill="#181206" stroke="#F59E0B" stroke-width="2.5"/>
  <rect x="42" y="148" width="5" height="68" rx="2" fill="#F59E0B"/>
  <!-- Subtle gold glow overlay -->
  <rect x="42" y="148" width="612" height="68" rx="10" fill="url(#goldGlow)" stroke="none"/>
  <!-- Star icon area -->
  <text x="68" y="177" text-anchor="middle" font-size="11" fill="#F59E0B" font-weight="700">06</text>
  <text x="68" y="193" text-anchor="middle" font-size="10" fill="#F59E0B">TOP</text>
  <text x="104" y="176" font-size="17" font-weight="700" fill="#F59E0B">Digital Trust</text>
  <text x="104" y="198" font-size="12" fill="#C8A84B">Reputation · Transparency · Accountability · Stakeholder Confidence</text>
  <rect x="530" y="162" width="116" height="24" rx="12" fill="#221A04" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="588" y="178" text-anchor="middle" font-size="11" fill="#F59E0B" font-weight="700">TRUST OUTPUT</text>

  <!-- Gold gradient overlay def -->
  <defs>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="upArrow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4A90F5"/>
      <stop offset="50%" stop-color="#22C98A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- ─── RIGHT PANEL: TRUST OUTPUT ─── -->
  <!-- Panel -->
  <rect x="676" y="148" width="182" height="448" rx="12" fill="#111D30" stroke="#1E2D47" stroke-width="1.5"/>

  <!-- Panel title -->
  <text x="767" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#F59E0B" letter-spacing="0.5">TRUST OUTPUT</text>
  <line x1="694" y1="189" x2="840" y2="189" stroke="#1E2D47" stroke-width="1"/>

  <!-- Connecting arrows from main stack to right panel -->
  <!-- Arrow from layer 6 to panel -->
  <line x1="654" y1="182" x2="674" y2="182" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="674,178 680,182 674,186" fill="#F59E0B"/>

  <!-- Arrow from layer 5 to panel -->
  <line x1="654" y1="258" x2="674" y2="258" stroke="#F0622A" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
  <!-- Arrow from layer 4 to panel -->
  <line x1="654" y1="334" x2="674" y2="334" stroke="#22C98A" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Arrow from layer 3 to panel -->
  <line x1="654" y1="410" x2="674" y2="410" stroke="#22C98A" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Arrow from layer 2 to panel -->
  <line x1="654" y1="486" x2="674" y2="486" stroke="#4A90F5" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Arrow from layer 1 to panel -->
  <line x1="654" y1="562" x2="674" y2="562" stroke="#4A90F5" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.35"/>

  <!-- Stakeholder pills -->
  <!-- Customers -->
  <rect x="700" y="208" width="134" height="60" rx="10" fill="#0D1B3E" stroke="#4A90F5" stroke-width="1.5"/>
  <text x="767" y="232" text-anchor="middle" font-size="18">👥</text>
  <text x="767" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF2F7">Customers</text>
  <text x="767" y="265" text-anchor="middle" font-size="10" fill="#4A90F5">Brand loyalty &amp; confidence</text>

  <!-- Partners -->
  <rect x="700" y="282" width="134" height="60" rx="10" fill="#0D1B3E" stroke="#22C98A" stroke-width="1.5"/>
  <text x="767" y="306" text-anchor="middle" font-size="18">🤝</text>
  <text x="767" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF2F7">Partners</text>
  <text x="767" y="339" text-anchor="middle" font-size="10" fill="#22C98A">B2B trust &amp; integration</text>

  <!-- Regulators -->
  <rect x="700" y="356" width="134" height="60" rx="10" fill="#0D1B3E" stroke="#F0622A" stroke-width="1.5"/>
  <text x="767" y="380" text-anchor="middle" font-size="18">⚖️</text>
  <text x="767" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF2F7">Regulators</text>
  <text x="767" y="413" text-anchor="middle" font-size="10" fill="#F0622A">Compliance assurance</text>

  <!-- Investors -->
  <rect x="700" y="430" width="134" height="60" rx="10" fill="#0D1B3E" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="767" y="454" text-anchor="middle" font-size="18">📈</text>
  <text x="767" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF2F7">Investors</text>
  <text x="767" y="487" text-anchor="middle" font-size="10" fill="#F59E0B">Risk profile &amp; valuation</text>

  <!-- Bottom caption in panel -->
  <text x="767" y="530" text-anchor="middle" font-size="10" fill="#8596AD">Each stakeholder receives</text>
  <text x="767" y="544" text-anchor="middle" font-size="10" fill="#8596AD">value from every layer</text>
  <text x="767" y="572" text-anchor="middle" font-size="10" fill="#4A90F5" font-weight="600">Trust = ∑ Layers</text>

  <!-- ─── BOTTOM LEGEND ─── -->
  <rect x="42" y="638" width="612" height="44" rx="8" fill="#111D30" stroke="#1E2D47" stroke-width="1"/>
  <text x="80" y="654" font-size="11" fill="#8596AD">COLOR GUIDE:</text>
  <!-- Blue -->
  <rect x="162" y="644" width="14" height="14" rx="3" fill="#4A90F5"/>
  <text x="182" y="655" font-size="11" fill="#8596AD">Security Infrastructure</text>
  <!-- Green -->
  <rect x="338" y="644" width="14" height="14" rx="3" fill="#22C98A"/>
  <text x="358" y="655" font-size="11" fill="#8596AD">Governance &amp; Privacy</text>
  <!-- Orange -->
  <rect x="500" y="644" width="14" height="14" rx="3" fill="#F0622A"/>
  <text x="520" y="655" font-size="11" fill="#8596AD">AI Controls</text>

  <!-- Blue -->
  <rect x="162" y="664" width="14" height="14" rx="3" fill="#F59E0B"/>
  <text x="182" y="675" font-size="11" fill="#8596AD">Trust Apex</text>
  <text x="338" y="675" font-size="11" fill="#8596AD">Layers build from Technical Foundation → Digital Trust</text>
</svg>

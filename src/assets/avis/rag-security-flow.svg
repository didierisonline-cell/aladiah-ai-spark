<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" style="font-family: system-ui, -apple-system, sans-serif;">
  <!-- Background -->
  <rect width="900" height="580" fill="#0B111E"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#EDF2F7" letter-spacing="0.5">RAG Security Attack Surface</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#8596AD" letter-spacing="1">HOW ATTACKERS COMPROMISE AI RETRIEVAL SYSTEMS</text>

  <line x1="60" y1="80" x2="840" y2="80" stroke="#1E2D47" stroke-width="1"/>

  <!-- Section label: Normal RAG Flow -->
  <rect x="30" y="92" width="140" height="22" rx="4" fill="#4A90F5" fill-opacity="0.15" stroke="#4A90F5" stroke-width="1"/>
  <text x="100" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#4A90F5">Normal RAG Flow</text>

  <!-- ============ NORMAL FLOW NODES ============ -->
  <!-- Node 1: User Query -->
  <rect x="30" y="150" width="110" height="52" rx="8" fill="#111D30" stroke="#4A90F5" stroke-width="2"/>
  <text x="85" y="170" text-anchor="middle" font-size="10" fill="#4A90F5">👤</text>
  <text x="85" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#EDF2F7">User Query</text>
  <text x="85" y="198" text-anchor="middle" font-size="9" fill="#8596AD">Input prompt</text>

  <!-- Arrow 1→2 -->
  <line x1="140" y1="176" x2="168" y2="176" stroke="#4A90F5" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Node 2: LLM -->
  <rect x="168" y="150" width="110" height="52" rx="8" fill="#111D30" stroke="#4A90F5" stroke-width="2"/>
  <text x="223" y="170" text-anchor="middle" font-size="10" fill="#4A90F5">🤖</text>
  <text x="223" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#EDF2F7">LLM</text>
  <text x="223" y="198" text-anchor="middle" font-size="9" fill="#8596AD">Query processing</text>

  <!-- Arrow 2→3 -->
  <line x1="278" y1="176" x2="306" y2="176" stroke="#4A90F5" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Node 3: Retrieval System -->
  <rect x="306" y="150" width="126" height="52" rx="8" fill="#111D30" stroke="#4A90F5" stroke-width="2"/>
  <text x="369" y="170" text-anchor="middle" font-size="10" fill="#4A90F5">🔍</text>
  <text x="369" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#EDF2F7">Retrieval System</text>
  <text x="369" y="198" text-anchor="middle" font-size="9" fill="#8596AD">Similarity search</text>

  <!-- Arrow 3→4 -->
  <line x1="432" y1="176" x2="460" y2="176" stroke="#4A90F5" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Node 4: Vector DB -->
  <rect x="460" y="150" width="110" height="52" rx="8" fill="#111D30" stroke="#4A90F5" stroke-width="2"/>
  <text x="515" y="170" text-anchor="middle" font-size="10" fill="#4A90F5">🗄️</text>
  <text x="515" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#EDF2F7">Vector DB</text>
  <text x="515" y="198" text-anchor="middle" font-size="9" fill="#8596AD">Embeddings store</text>

  <!-- Arrow 4→5 -->
  <line x1="570" y1="176" x2="598" y2="176" stroke="#4A90F5" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Node 5: Documents (POISONED) -->
  <rect x="598" y="140" width="120" height="72" rx="8" fill="#2A0E0E" stroke="#EF4444" stroke-width="2.5"/>
  <rect x="598" y="140" width="120" height="72" rx="8" fill="#EF4444" fill-opacity="0.08"/>
  <text x="658" y="163" text-anchor="middle" font-size="10" fill="#EF4444">⚠</text>
  <text x="658" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#EDF2F7">Documents</text>
  <text x="658" y="192" text-anchor="middle" font-size="9" fill="#EF4444" font-weight="600">POISONED</text>
  <text x="658" y="205" text-anchor="middle" font-size="9" fill="#8596AD">Retrieved context</text>

  <!-- Arrow 5→6 -->
  <line x1="718" y1="176" x2="746" y2="176" stroke="#4A90F5" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Node 6: LLM Response -->
  <rect x="746" y="150" width="120" height="52" rx="8" fill="#111D30" stroke="#4A90F5" stroke-width="2"/>
  <text x="806" y="170" text-anchor="middle" font-size="10" fill="#4A90F5">💬</text>
  <text x="806" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#EDF2F7">LLM Response</text>
  <text x="806" y="198" text-anchor="middle" font-size="9" fill="#8596AD">Generated answer</text>

  <!-- ============ ATTACK VECTORS ============ -->

  <!-- Attack 1: Document Poisoning label at Vector DB -->
  <rect x="420" y="238" width="152" height="34" rx="6" fill="#2A0E0E" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="496" y="253" text-anchor="middle" font-size="10" font-weight="700" fill="#EF4444">Document Poisoning</text>
  <text x="496" y="266" text-anchor="middle" font-size="9" fill="#8596AD">Malicious embeddings injected</text>
  <!-- Line from Vector DB down -->
  <line x1="515" y1="202" x2="515" y2="238" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Attack 2: Indirect Prompt Injection — poisoned docs → LLM Response -->
  <path d="M658,212 Q658,290 806,290 Q806,290 806,202" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <rect x="682" y="272" width="186" height="34" rx="6" fill="#2A0E0E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="775" y="287" text-anchor="middle" font-size="10" font-weight="700" fill="#EF4444">Indirect Prompt Injection</text>
  <text x="775" y="300" text-anchor="middle" font-size="9" fill="#8596AD">Malicious instructions hijack the LLM</text>

  <!-- Attack 3: Data Leakage arrow from Vector DB going down -->
  <line x1="460" y1="176" x2="390" y2="320" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <rect x="295" y="316" width="148" height="34" rx="6" fill="#2A0E0E" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="369" y="331" text-anchor="middle" font-size="10" font-weight="700" fill="#EF4444">Data Leakage</text>
  <text x="369" y="344" text-anchor="middle" font-size="9" fill="#8596AD">Sensitive docs exposed via queries</text>

  <!-- Red dashed box around Retrieval System (attack surface) -->
  <rect x="299" y="143" width="140" height="66" rx="10" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Attacker icon -->
  <!-- Triangle/diamond threat actor -->
  <polygon points="120,380 140,420 100,420" fill="#EF4444" fill-opacity="0.25" stroke="#EF4444" stroke-width="2"/>
  <text x="120" y="445" text-anchor="middle" font-size="10" font-weight="700" fill="#EF4444">ATTACKER</text>

  <!-- Arrow from Attacker to Documents -->
  <path d="M140,400 Q400,440 598,200" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>

  <!-- Attack label for Retrieval System box -->
  <text x="369" y="136" text-anchor="middle" font-size="9" font-weight="600" fill="#EF4444">← Attack Surface</text>

  <!-- ============ LEGEND ============ -->
  <rect x="30" y="470" width="840" height="80" rx="8" fill="#111D30" stroke="#1E2D47" stroke-width="1.5"/>
  <text x="450" y="492" text-anchor="middle" font-size="11" font-weight="700" fill="#8596AD" letter-spacing="1">LEGEND</text>

  <!-- Blue item -->
  <line x1="100" y1="514" x2="140" y2="514" stroke="#4A90F5" stroke-width="2.5"/>
  <text x="148" y="518" font-size="11" fill="#EDF2F7">Normal RAG Flow</text>

  <!-- Red dashed item -->
  <line x1="300" y1="514" x2="340" y2="514" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="348" y="518" font-size="11" fill="#EDF2F7">Attack Vector</text>

  <!-- Red border item -->
  <rect x="560" y="506" width="24" height="16" rx="3" fill="#2A0E0E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="590" y="518" font-size="11" fill="#EDF2F7">Compromised Component</text>

  <!-- Threat actors -->
  <polygon points="100,535 110,548 90,548" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444" stroke-width="1.5"/>
  <text x="148" y="545" font-size="11" fill="#EDF2F7">Threat Actor</text>

  <!-- Defs -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4A90F5"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#EF4444"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
    <!-- Blue glow filter -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Green glow filter -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Subtle shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90F5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22C98A"/>
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#8596AD"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- BACKGROUND                                                  -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect width="900" height="600" fill="#0B111E"/>

  <!-- Subtle grid overlay -->
  <line x1="0" y1="70" x2="900" y2="70" stroke="#1E2D47" stroke-width="0.5" stroke-opacity="0.6"/>
  <line x1="0" y1="290" x2="900" y2="290" stroke="#1E2D47" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="0" y1="455" x2="900" y2="455" stroke="#1E2D47" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- TITLE AREA (y 0–70)                                        -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#EDF2F7" font-size="22" font-weight="700" letter-spacing="-0.3">Decentralized Identity — DIDs &amp; Verifiable Credentials</text>
  <!-- Subtitle -->
  <text x="450" y="58" text-anchor="middle" fill="#8596AD" font-size="11" font-weight="600" letter-spacing="2">MODULE 19 · AI ENTERPRISE CYBERSECURITY</text>
  <!-- Divider -->
  <line x1="20" y1="70" x2="880" y2="70" stroke="#1E2D47" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MAIN FLOW DIAGRAM (y=85 to y=290)                          -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- ─── NODE 1: ISSUER (x=30–195) ─── -->
  <!-- Outer card -->
  <rect x="30" y="100" width="165" height="170" rx="10" fill="#0D1829" stroke="#4A90F5" stroke-width="2" filter="url(#shadow)"/>
  <!-- Header bar -->
  <rect x="30" y="100" width="165" height="28" rx="10" fill="#1A2E4A"/>
  <rect x="30" y="114" width="165" height="14" fill="#1A2E4A"/>
  <text x="112" y="119" text-anchor="middle" fill="#4A90F5" font-size="13" font-weight="700" letter-spacing="1">ISSUER</text>

  <!-- Lock icon — shackle (U-shape) -->
  <path d="M100,145 L100,138 Q112,128 124,138 L124,145" stroke="#4A90F5" fill="none" stroke-width="3"/>
  <!-- Lock body -->
  <rect x="97" y="145" width="30" height="24" rx="3" fill="#4A90F5"/>
  <!-- Keyhole -->
  <circle cx="112" cy="155" r="4" fill="#0D1829"/>
  <rect x="110" y="156" width="4" height="6" rx="1" fill="#0D1829"/>

  <!-- Examples text -->
  <text x="112" y="186" text-anchor="middle" fill="#8596AD" font-size="10">University</text>
  <text x="112" y="199" text-anchor="middle" fill="#8596AD" font-size="10">Employer</text>
  <text x="112" y="212" text-anchor="middle" fill="#8596AD" font-size="10">Government</text>
  <!-- Node label -->
  <text x="112" y="255" text-anchor="middle" fill="#4A90F5" font-size="10" font-weight="600">Issues VC</text>

  <!-- ─── ARROW 1 (Node 1 → Node 2) ─── -->
  <line x1="195" y1="185" x2="282" y2="185" stroke="#4A90F5" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="240" y="176" text-anchor="middle" fill="#EDF2F7" font-size="11" font-weight="500">Issues VC</text>
  <text x="240" y="198" text-anchor="middle" fill="#8596AD" font-size="9">(cryptographically signed)</text>

  <!-- ─── NODE 2: DIGITAL WALLET (x=285–490) ─── -->
  <!-- Outer card -->
  <rect x="285" y="100" width="205" height="170" rx="10" fill="#0D0D1A" stroke="#9B59B6" stroke-width="2" filter="url(#shadow)"/>
  <!-- Header bar -->
  <rect x="285" y="100" width="205" height="28" rx="10" fill="#1A1530"/>
  <rect x="285" y="114" width="205" height="14" fill="#1A1530"/>
  <text x="387" y="119" text-anchor="middle" fill="#9B59B6" font-size="13" font-weight="700" letter-spacing="1">DIGITAL WALLET</text>

  <!-- Person icon — head -->
  <circle cx="387" cy="148" r="14" fill="#9B59B6"/>
  <!-- Person icon — body arc (shoulders) -->
  <path d="M363,172 Q363,160 387,158 Q411,160 411,172" fill="#9B59B6"/>

  <!-- Bullet points -->
  <text x="295" y="192" fill="#8596AD" font-size="10">· Owner controls private keys</text>
  <text x="295" y="207" fill="#8596AD" font-size="10">· Self-sovereign</text>
  <text x="295" y="222" fill="#8596AD" font-size="10">· No central authority</text>

  <!-- ─── ARROW 2 (Node 2 → Node 3) ─── -->
  <line x1="490" y1="185" x2="577" y2="185" stroke="#22C98A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="534" y="176" text-anchor="middle" fill="#EDF2F7" font-size="11" font-weight="500">Presents</text>
  <text x="534" y="190" text-anchor="middle" fill="#EDF2F7" font-size="11" font-weight="500">credential</text>

  <!-- ─── NODE 3: VERIFIER (x=580–745) ─── -->
  <!-- Outer card -->
  <rect x="580" y="100" width="165" height="170" rx="10" fill="#081A10" stroke="#22C98A" stroke-width="2" filter="url(#shadow)"/>
  <!-- Header bar -->
  <rect x="580" y="100" width="165" height="28" rx="10" fill="#152A1E"/>
  <rect x="580" y="114" width="165" height="14" fill="#152A1E"/>
  <text x="662" y="119" text-anchor="middle" fill="#22C98A" font-size="13" font-weight="700" letter-spacing="1">VERIFIER</text>

  <!-- Checkmark icon -->
  <path d="M637,162 L655,180 L687,148" stroke="#22C98A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Examples text -->
  <text x="662" y="200" text-anchor="middle" fill="#8596AD" font-size="10">Employer</text>
  <text x="662" y="213" text-anchor="middle" fill="#8596AD" font-size="10">Border Control</text>
  <text x="662" y="226" text-anchor="middle" fill="#8596AD" font-size="10">Digital System</text>

  <!-- No issuer contact badge -->
  <rect x="600" y="241" width="124" height="18" rx="4" fill="#22C98A" fill-opacity="0.2" stroke="#22C98A" stroke-width="1"/>
  <text x="662" y="253" text-anchor="middle" fill="#22C98A" font-size="9" font-weight="600">No issuer contact</text>

  <!-- ─── BLOCKCHAIN VERIFICATION BAR (x=755–880, y=100–270) ─── -->
  <rect x="755" y="100" width="125" height="170" rx="8" fill="#111D30" stroke="#1E2D47" stroke-width="1.5"/>
  <text x="817" y="120" text-anchor="middle" fill="#8596AD" font-size="10" font-weight="700" letter-spacing="1">BLOCKCHAIN</text>
  <line x1="765" y1="126" x2="870" y2="126" stroke="#1E2D47" stroke-width="1"/>
  <text x="817" y="142" text-anchor="middle" fill="#EDF2F7" font-size="9" font-weight="600">Public Key</text>
  <text x="817" y="154" text-anchor="middle" fill="#EDF2F7" font-size="9" font-weight="600">Registry</text>

  <!-- Chain link icons -->
  <!-- Link 1 -->
  <circle cx="817" cy="178" r="8" fill="none" stroke="#4A90F5" stroke-width="2"/>
  <line x1="817" y1="186" x2="817" y2="195" stroke="#4A90F5" stroke-width="2"/>
  <!-- Link 2 -->
  <circle cx="817" cy="203" r="8" fill="none" stroke="#4A90F5" stroke-width="2"/>
  <line x1="817" y1="211" x2="817" y2="220" stroke="#4A90F5" stroke-width="2"/>
  <!-- Link 3 -->
  <circle cx="817" cy="228" r="8" fill="none" stroke="#4A90F5" stroke-width="2"/>

  <text x="817" y="252" text-anchor="middle" fill="#4A90F5" font-size="9" font-weight="600">Immutable · Public</text>

  <!-- Dashed lines from blockchain bar to nodes -->
  <line x1="755" y1="160" x2="745" y2="160" stroke="#1E2D47" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="755" y1="185" x2="745" y2="185" stroke="#1E2D47" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ─── RETURN ARROW (curved arc below flow nodes) ─── -->
  <path d="M662,270 Q450,310 112,270" stroke="#8596AD" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-start="url(#arrowGrey)"/>
  <text x="390" y="305" text-anchor="middle" fill="#8596AD" font-size="10">Verifies signature · No issuer contact needed</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- CONTRAST SECTION (y=315 to y=450)                          -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- ─── OLD MODEL ─── -->
  <rect x="20" y="315" width="415" height="130" rx="8" fill="#1A0808" stroke="#3D1A1A" stroke-width="1.5"/>
  <!-- Red tint overlay -->
  <rect x="20" y="315" width="415" height="130" rx="8" fill="#EF4444" fill-opacity="0.05"/>

  <!-- Header row -->
  <text x="40" y="338" fill="#EF4444" font-size="13" font-weight="700" letter-spacing="0.5">OLD MODEL</text>
  <text x="100" y="338" fill="#3D1A1A" font-size="13" font-weight="700">——————————————————————</text>

  <!-- Item 1 -->
  <text x="40" y="363" fill="#EF4444" font-size="14" font-weight="700">×</text>
  <text x="58" y="363" fill="#EDF2F7" font-size="12">Siloed identity per platform</text>

  <!-- Item 2 -->
  <text x="40" y="388" fill="#EF4444" font-size="14" font-weight="700">×</text>
  <text x="58" y="388" fill="#EDF2F7" font-size="12">Central databases = breach targets</text>

  <!-- Item 3 -->
  <text x="40" y="413" fill="#EF4444" font-size="14" font-weight="700">×</text>
  <text x="58" y="413" fill="#EDF2F7" font-size="12">Platform-controlled, not user-owned</text>

  <!-- ─── NEW MODEL ─── -->
  <rect x="455" y="315" width="425" height="130" rx="8" fill="#081A10" stroke="#1A3A25" stroke-width="1.5"/>
  <!-- Green tint overlay -->
  <rect x="455" y="315" width="425" height="130" rx="8" fill="#22C98A" fill-opacity="0.05"/>

  <!-- Header row -->
  <text x="475" y="338" fill="#22C98A" font-size="13" font-weight="700" letter-spacing="0.5">NEW MODEL</text>
  <text x="545" y="338" fill="#1A3A25" font-size="13" font-weight="700">——————————————————————</text>

  <!-- Item 1 -->
  <text x="475" y="363" fill="#22C98A" font-size="14" font-weight="700">✓</text>
  <text x="496" y="363" fill="#EDF2F7" font-size="12">Self-sovereign digital identity</text>

  <!-- Item 2 -->
  <text x="475" y="388" fill="#22C98A" font-size="14" font-weight="700">✓</text>
  <text x="496" y="388" fill="#EDF2F7" font-size="12">Cryptographic proof, no central DB</text>

  <!-- Item 3 -->
  <text x="475" y="413" fill="#22C98A" font-size="14" font-weight="700">✓</text>
  <text x="496" y="413" fill="#EDF2F7" font-size="12">Portable across any platform</text>

  <!-- VS divider between columns -->
  <rect x="432" y="345" width="26" height="26" rx="13" fill="#1E2D47"/>
  <text x="445" y="362" text-anchor="middle" fill="#8596AD" font-size="10" font-weight="700">VS</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- STANDARDS BAR (y=460 to y=520)                             -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="20" y="460" width="860" height="85" rx="8" fill="#111D30" stroke="#1E2D47" stroke-width="1.5"/>

  <!-- Section label -->
  <text x="450" y="480" text-anchor="middle" fill="#8596AD" font-size="10" font-weight="700" letter-spacing="2">OPEN STANDARDS</text>
  <line x1="30" y1="484" x2="870" y2="484" stroke="#1E2D47" stroke-width="1"/>

  <!-- Standard 1: W3C DID -->
  <text x="167" y="506" text-anchor="middle" fill="#4A90F5" font-size="12" font-weight="600">W3C DID Standard</text>
  <text x="167" y="522" text-anchor="middle" fill="#8596AD" font-size="10">Decentralized Identifier spec</text>
  <text x="167" y="535" text-anchor="middle" fill="#8596AD" font-size="10">did:example:123abc...</text>

  <!-- Separator 1 -->
  <line x1="335" y1="490" x2="335" y2="540" stroke="#1E2D47" stroke-width="1"/>

  <!-- Standard 2: Verifiable Credentials -->
  <text x="450" y="506" text-anchor="middle" fill="#4A90F5" font-size="12" font-weight="600">Verifiable Credentials</text>
  <text x="450" y="522" text-anchor="middle" fill="#8596AD" font-size="10">W3C VC Data Model 2.0</text>
  <text x="450" y="535" text-anchor="middle" fill="#8596AD" font-size="10">JSON-LD · JWT · SD-JWT</text>

  <!-- Separator 2 -->
  <line x1="565" y1="490" x2="565" y2="540" stroke="#1E2D47" stroke-width="1"/>

  <!-- Standard 3: FIDO2 -->
  <text x="720" y="506" text-anchor="middle" fill="#4A90F5" font-size="12" font-weight="600">FIDO2 / WebAuthn</text>
  <text x="720" y="522" text-anchor="middle" fill="#8596AD" font-size="10">Passwordless authentication</text>
  <text x="720" y="535" text-anchor="middle" fill="#8596AD" font-size="10">Hardware-backed key pairs</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- FOOTER                                                      -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <line x1="20" y1="555" x2="880" y2="555" stroke="#1E2D47" stroke-width="1"/>
  <text x="450" y="573" text-anchor="middle" fill="#8596AD" font-size="9" fill-opacity="0.7">Identity owner holds &amp; presents credentials · Issuer signs once · Verifier checks cryptographic proof without calling home</text>

</svg>

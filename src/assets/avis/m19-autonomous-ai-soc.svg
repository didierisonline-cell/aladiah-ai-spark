<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="900" height="600" fill="#0B111E"/>

  <!-- Title area -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#EDF2F7" letter-spacing="0.5">Autonomous AI SOC — The Self-Defending Enterprise</text>
  <text x="450" y="54" text-anchor="middle" font-size="11" font-weight="500" fill="#8596AD" letter-spacing="2">MODULE 19 · AI ENTERPRISE CYBERSECURITY</text>

  <!-- Horizontal divider -->
  <line x1="30" y1="66" x2="870" y2="66" stroke="#1E2D47" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 1: DETECTION — y=76 to y=144 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Card background -->
  <rect x="30" y="76" width="670" height="68" rx="6" fill="#111D30"/>
  <rect x="30" y="76" width="670" height="68" rx="6" fill="#4A90F5" fill-opacity="0.08"/>
  <rect x="30" y="76" width="670" height="68" rx="6" stroke="#1E2D47" stroke-width="1" fill="none"/>
  <!-- Left accent bar -->
  <rect x="30" y="76" width="4" height="68" rx="2" fill="#4A90F5"/>

  <!-- Detection icon: radar circle with lines -->
  <circle cx="72" cy="110" r="18" fill="none" stroke="#4A90F5" stroke-width="1.5" opacity="0.5"/>
  <circle cx="72" cy="110" r="11" fill="none" stroke="#4A90F5" stroke-width="1.5" opacity="0.7"/>
  <circle cx="72" cy="110" r="4" fill="#4A90F5"/>
  <!-- Radar sweep line -->
  <line x1="72" y1="110" x2="82" y2="96" stroke="#4A90F5" stroke-width="1.5"/>
  <!-- Ping dots -->
  <circle cx="85" cy="100" r="2" fill="#4A90F5" opacity="0.8"/>
  <circle cx="61" cy="95" r="1.5" fill="#4A90F5" opacity="0.5"/>

  <!-- Label and description -->
  <text x="105" y="103" font-size="13" font-weight="700" fill="#4A90F5" letter-spacing="1">DETECTION LAYER</text>
  <text x="105" y="120" font-size="11" fill="#8596AD">Full telemetry ingestion · Behavioral baseline · Real-time anomaly scoring</text>

  <!-- Arrow 1→2 -->
  <polygon points="365,149 371,159 359,159" fill="#9B59B6"/>
  <line x1="365" y1="144" x2="365" y2="149" stroke="#9B59B6" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 2: INVESTIGATION — y=162 to y=230 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="162" width="670" height="68" rx="6" fill="#111D30"/>
  <rect x="30" y="162" width="670" height="68" rx="6" fill="#9B59B6" fill-opacity="0.08"/>
  <rect x="30" y="162" width="670" height="68" rx="6" stroke="#1E2D47" stroke-width="1" fill="none"/>
  <rect x="30" y="162" width="4" height="68" rx="2" fill="#9B59B6"/>

  <!-- Investigation icon: connected dots / graph -->
  <circle cx="60" cy="196" r="4" fill="#9B59B6"/>
  <circle cx="78" cy="187" r="4" fill="#9B59B6"/>
  <circle cx="84" cy="206" r="4" fill="#9B59B6"/>
  <circle cx="68" cy="215" r="4" fill="#9B59B6"/>
  <line x1="60" y1="196" x2="78" y2="187" stroke="#9B59B6" stroke-width="1.5" opacity="0.7"/>
  <line x1="78" y1="187" x2="84" y2="206" stroke="#9B59B6" stroke-width="1.5" opacity="0.7"/>
  <line x1="84" y1="206" x2="68" y2="215" stroke="#9B59B6" stroke-width="1.5" opacity="0.7"/>
  <line x1="68" y1="215" x2="60" y2="196" stroke="#9B59B6" stroke-width="1.5" opacity="0.7"/>
  <line x1="60" y1="196" x2="84" y2="206" stroke="#9B59B6" stroke-width="1" opacity="0.4"/>

  <text x="105" y="189" font-size="13" font-weight="700" fill="#9B59B6" letter-spacing="1">INVESTIGATION LAYER</text>
  <text x="105" y="206" font-size="11" fill="#8596AD">Automated attack graph construction · Kill chain correlation</text>

  <!-- Arrow 2→3 -->
  <polygon points="365,235 371,245 359,245" fill="#F0622A"/>
  <line x1="365" y1="230" x2="365" y2="235" stroke="#F0622A" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 3: CONTAINMENT — y=248 to y=316 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="248" width="670" height="68" rx="6" fill="#111D30"/>
  <rect x="30" y="248" width="670" height="68" rx="6" fill="#F0622A" fill-opacity="0.08"/>
  <rect x="30" y="248" width="670" height="68" rx="6" stroke="#1E2D47" stroke-width="1" fill="none"/>
  <rect x="30" y="248" width="4" height="68" rx="2" fill="#F0622A"/>

  <!-- Containment icon: shield polygon -->
  <polygon points="72,280 86,286 86,296 72,304 58,296 58,286" fill="none" stroke="#F0622A" stroke-width="1.8"/>
  <!-- Shield inner check -->
  <polyline points="65,292 70,297 79,285" fill="none" stroke="#F0622A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="105" y="275" font-size="13" font-weight="700" fill="#F0622A" letter-spacing="1">CONTAINMENT LAYER</text>
  <text x="105" y="292" font-size="11" fill="#8596AD">Pre-authorized response · Host isolation · Credential revocation</text>

  <!-- Arrow 3→4 -->
  <polygon points="365,321 371,331 359,331" fill="#22C98A"/>
  <line x1="365" y1="316" x2="365" y2="321" stroke="#22C98A" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 4: COMMUNICATION — y=334 to y=402 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="334" width="670" height="68" rx="6" fill="#111D30"/>
  <rect x="30" y="334" width="670" height="68" rx="6" fill="#22C98A" fill-opacity="0.08"/>
  <rect x="30" y="334" width="670" height="68" rx="6" stroke="#1E2D47" stroke-width="1" fill="none"/>
  <rect x="30" y="334" width="4" height="68" rx="2" fill="#22C98A"/>

  <!-- Communication icon: speech bubble -->
  <rect x="54" y="352" width="34" height="24" rx="4" fill="none" stroke="#22C98A" stroke-width="1.8"/>
  <!-- Bubble tail -->
  <polygon points="60,376 60,384 68,376" fill="#22C98A" opacity="0.7"/>
  <!-- Bubble lines -->
  <line x1="59" y1="359" x2="82" y2="359" stroke="#22C98A" stroke-width="1.5" opacity="0.6"/>
  <line x1="59" y1="365" x2="74" y2="365" stroke="#22C98A" stroke-width="1.5" opacity="0.6"/>

  <text x="105" y="361" font-size="13" font-weight="700" fill="#22C98A" letter-spacing="1">COMMUNICATION LAYER</text>
  <text x="105" y="378" font-size="11" fill="#8596AD">Executive summaries · Business impact quantification</text>

  <!-- Arrow 4→5 -->
  <polygon points="365,407 371,417 359,417" fill="#00B4D8"/>
  <line x1="365" y1="402" x2="365" y2="407" stroke="#00B4D8" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LAYER 5: LEARNING — y=420 to y=488 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="30" y="420" width="670" height="68" rx="6" fill="#111D30"/>
  <rect x="30" y="420" width="670" height="68" rx="6" fill="#00B4D8" fill-opacity="0.08"/>
  <rect x="30" y="420" width="670" height="68" rx="6" stroke="#1E2D47" stroke-width="1" fill="none"/>
  <rect x="30" y="420" width="4" height="68" rx="2" fill="#00B4D8"/>

  <!-- Learning icon: circular arrow (refresh) -->
  <!-- Outer arc ~270 degrees -->
  <path d="M 72 436 A 16 16 0 1 1 56.5 451" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round"/>
  <!-- Arrow head on arc end -->
  <polygon points="56,451 50,445 62,444" fill="#00B4D8"/>

  <text x="105" y="447" font-size="13" font-weight="700" fill="#00B4D8" letter-spacing="1">LEARNING LAYER</text>
  <text x="105" y="464" font-size="11" fill="#8596AD">Continuous model improvement · Every incident feeds the AI</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- RIGHT SIDEBAR: HUMAN OVERSIGHT — x=715 to 870, y=76 to y=488 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="715" y="76" width="155" height="412" rx="6" fill="#111D30" stroke="#1E2D47" stroke-width="1"/>
  <!-- Gold left accent border -->
  <rect x="715" y="76" width="3" height="412" rx="1" fill="#F59E0B"/>

  <!-- Header -->
  <text x="793" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#EDF2F7" letter-spacing="1.5">HUMAN OVERSIGHT</text>
  <line x1="725" y1="108" x2="863" y2="108" stroke="#1E2D47" stroke-width="1"/>

  <!-- Human figure icon -->
  <circle cx="793" cy="138" r="14" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <circle cx="793" cy="133" r="6" fill="#F59E0B" opacity="0.8"/>
  <path d="M 779 152 Q 793 145 807 152" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>

  <line x1="725" y1="163" x2="863" y2="163" stroke="#1E2D47" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Oversight item 1 -->
  <polygon points="730,183 734,179 738,183 734,187" fill="#F59E0B"/>
  <text x="745" y="187" font-size="10.5" fill="#EDF2F7">Define AI</text>
  <text x="745" y="200" font-size="10.5" fill="#EDF2F7">authority scope</text>

  <line x1="725" y1="212" x2="863" y2="212" stroke="#1E2D47" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Oversight item 2 -->
  <polygon points="730,232 734,228 738,232 734,236" fill="#F59E0B"/>
  <text x="745" y="236" font-size="10.5" fill="#EDF2F7">Review edge-case</text>
  <text x="745" y="249" font-size="10.5" fill="#EDF2F7">escalations</text>

  <line x1="725" y1="261" x2="863" y2="261" stroke="#1E2D47" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Oversight item 3 -->
  <polygon points="730,281 734,277 738,281 734,285" fill="#F59E0B"/>
  <text x="745" y="285" font-size="10.5" fill="#EDF2F7">High-stakes</text>
  <text x="745" y="298" font-size="10.5" fill="#EDF2F7">response decisions</text>

  <line x1="725" y1="312" x2="863" y2="312" stroke="#1E2D47" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Trust label -->
  <text x="793" y="346" text-anchor="middle" font-size="9.5" fill="#8596AD" letter-spacing="0.5">AI AUTONOMY LEVEL</text>
  <!-- Autonomy gauge bar -->
  <rect x="730" y="354" width="126" height="8" rx="4" fill="#1E2D47"/>
  <rect x="730" y="354" width="96" height="8" rx="4" fill="#4A90F5" opacity="0.8"/>
  <text x="793" y="376" text-anchor="middle" font-size="9" fill="#4A90F5">76% Automated</text>

  <line x1="725" y1="390" x2="863" y2="390" stroke="#1E2D47" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Status indicator -->
  <circle cx="737" cy="415" r="5" fill="#22C98A"/>
  <text x="748" y="419" font-size="10" fill="#22C98A" font-weight="600">ACTIVE</text>
  <text x="793" y="436" text-anchor="middle" font-size="9" fill="#8596AD">All systems nominal</text>

  <!-- Pulse rings around status dot -->
  <circle cx="737" cy="415" r="9" fill="none" stroke="#22C98A" stroke-width="0.8" opacity="0.4"/>
  <circle cx="737" cy="415" r="13" fill="none" stroke="#22C98A" stroke-width="0.5" opacity="0.2"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BOTTOM STATS BAR — y=500 to y=580 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Divider -->
  <line x1="30" y1="496" x2="870" y2="496" stroke="#1E2D47" stroke-width="1"/>

  <!-- Stats cards: 3 across -->
  <!-- Card 1: Mean Time to Detect -->
  <rect x="30" y="504" width="270" height="72" rx="6" fill="#111D30" stroke="#1E2D47" stroke-width="1"/>
  <rect x="30" y="504" width="270" height="3" rx="1" fill="#4A90F5"/>
  <text x="165" y="534" text-anchor="middle" font-size="26" font-weight="700" fill="#4A90F5">&lt; 1 MIN</text>
  <text x="165" y="557" text-anchor="middle" font-size="11" fill="#8596AD" letter-spacing="0.5">Mean Time to Detect</text>

  <!-- Card 2: Mean Time to Respond -->
  <rect x="315" y="504" width="270" height="72" rx="6" fill="#111D30" stroke="#1E2D47" stroke-width="1"/>
  <rect x="315" y="504" width="270" height="3" rx="1" fill="#F0622A"/>
  <text x="450" y="534" text-anchor="middle" font-size="26" font-weight="700" fill="#F0622A">&lt; 5 MIN</text>
  <text x="450" y="557" text-anchor="middle" font-size="11" fill="#8596AD" letter-spacing="0.5">Mean Time to Respond</text>

  <!-- Card 3: Autonomous Operation -->
  <rect x="600" y="504" width="270" height="72" rx="6" fill="#111D30" stroke="#1E2D47" stroke-width="1"/>
  <rect x="600" y="504" width="270" height="3" rx="1" fill="#22C98A"/>
  <text x="735" y="534" text-anchor="middle" font-size="26" font-weight="700" fill="#22C98A">24/7</text>
  <text x="735" y="557" text-anchor="middle" font-size="11" fill="#8596AD" letter-spacing="0.5">Autonomous Operation</text>

</svg>

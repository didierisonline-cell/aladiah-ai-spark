  <rect x="327" y="258" width="246" height="30" rx="12" fill="#1A1530" stroke="#9B59B6" stroke-width="1"/>
  <circle cx="347" cy="273" r="4" fill="#9B59B6"/>
  <text x="450" y="277" text-anchor="middle" font-size="12" fill="#EDF2F7" font-family="system-ui, -apple-system, sans-serif">AI Identity Governance Lead</text>


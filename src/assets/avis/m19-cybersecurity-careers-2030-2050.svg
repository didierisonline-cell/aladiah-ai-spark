  <!-- Banner sub-text -->
  <text x="450" y="500" text-anchor="middle" font-size="11" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif">AI × Cybersecurity × Your Domain = Career-Defining Advantage</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- ALADIAH BRANDING (y=535 to y=560) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <line x1="300" y1="530" x2="600" y2="530" stroke="#1E2D47" stroke-width="1"/>
  <text x="450" y="548" text-anchor="middle" font-size="10" fill="#8596AD" letter-spacing="2" font-family="system-ui, -apple-system, sans-serif">ALADIAH ACADEMY</text>

</svg>

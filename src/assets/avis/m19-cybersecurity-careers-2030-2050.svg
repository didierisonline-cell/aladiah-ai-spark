  <!-- ═══════════════════════════════════════════════════════════ -->
  <text x="450" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#22C98A" letter-spacing="1.5" font-family="system-ui, -apple-system, sans-serif">SKILLS THAT COMPOUND</text>
  <rect x="350" y="347" width="200" height="2" fill="#22C98A"/>

  <!-- Skill Card 1 (x=30, y=355, width=258, height=80) -->
  <rect x="30" y="355" width="258" height="80" rx="8" fill="#081A10" stroke="#22C98A" stroke-width="1.5"/>
  <!-- Green left accent bar -->
  <rect x="30" y="355" width="3" height="80" fill="#22C98A" clip-path="url(#skill1-clip)"/>
  <text x="165" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF2F7" font-family="system-ui, -apple-system, sans-serif">Judgment (not just tools)</text>
  <text x="165" y="405" text-anchor="middle" font-size="10" fill="#8596AD" font-family="system-ui, -apple-system, sans-serif">Human reasoning that AI cannot replace</text>
  <!-- Green icon dot -->
  <circle cx="46" cy="390" r="3" fill="#22C98A"/>

  <!-- Skill Card 2 (x=321, y=355, width=258, height=80) -->
  <rect x="321" y="355" width="258" height="80" rx="8" fill="#081A10" stroke="#22C98A" stroke-width="1.5"/>

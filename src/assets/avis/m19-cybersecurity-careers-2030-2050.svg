  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="20" y="450" width="860" height="68" rx="8" fill="#1A1408" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Gold tint overlay -->
  <rect x="20" y="450" width="860" height="68" rx="8" fill="#F59E0B" fill-opacity="0.06" clip-path="url(#banner-clip)"/>

  <!-- Left star polygon (5-pointed) centered at x=55, y=484 -->
  <!-- 5-pointed star: outer r=14, inner r=6, starting from top -->
  <polygon points="
    55,470
    58.27,479.45
    68.27,479.45
    60.47,485.27
    63.39,494.72
    55,489.19
    46.61,494.72
    49.53,485.27
    41.73,479.45
    51.73,479.45
  " fill="#F59E0B"/>

  <!-- Right star polygon centered at x=845, y=484 -->
  <polygon points="
    845,470
    848.27,479.45
    858.27,479.45
    850.47,485.27
    853.39,494.72
    845,489.19
    836.61,494.72
    839.53,485.27
    831.73,479.45
    841.73,479.45
  " fill="#F59E0B"/>

  <!-- Main banner text -->

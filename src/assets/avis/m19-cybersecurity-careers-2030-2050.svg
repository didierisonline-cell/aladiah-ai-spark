  <!-- Background -->
  <rect width="900" height="600" fill="#0B111E"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- TITLE AREA (y 0–70) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#EDF2F7" font-family="system-ui, -apple-system, sans-serif">Cybersecurity Career Roadmap 2030–2050</text>
  <text x="450" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#4A90F5" letter-spacing="2" font-family="system-ui, -apple-system, sans-serif">MODULE 19 · AI ENTERPRISE CYBERSECURITY</text>
  <line x1="20" y1="70" x2="880" y2="70" stroke="#1E2D47" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- TIMELINE HEADER (y=80 to y=115) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Timeline track -->
  <line x1="60" y1="100" x2="840" y2="100" stroke="#1E2D47" stroke-width="4"/>

  <!-- Milestone dot x=60: 2025 (blue) -->
  <circle cx="60" cy="100" r="6" fill="#4A90F5"/>
  <text x="60" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#4A90F5" font-family="system-ui, -apple-system, sans-serif">2025</text>

  <!-- Milestone dot x=340: 2030 (purple) -->
  <circle cx="340" cy="100" r="6" fill="#9B59B6"/>
  <text x="340" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#9B59B6" font-family="system-ui, -apple-system, sans-serif">2030</text>

  <!-- Milestone dot x=620: 2040 (gold) -->
  <circle cx="620" cy="100" r="6" fill="#F59E0B"/>
  <text x="620" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif">2040</text>

  <!-- Milestone dot x=840: 2050 (gold) -->

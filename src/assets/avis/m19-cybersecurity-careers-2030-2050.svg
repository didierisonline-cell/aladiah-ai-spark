<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" style="font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8596AD"/>
    </marker>
    <clipPath id="era1-clip">
      <rect x="20" y="120" width="270" height="190" rx="8"/>
    </clipPath>
    <clipPath id="era2-clip">
      <rect x="315" y="120" width="270" height="190" rx="8"/>
    </clipPath>
    <clipPath id="era3-clip">
      <rect x="610" y="120" width="270" height="190" rx="8"/>
    </clipPath>
    <clipPath id="skill1-clip">
      <rect x="30" y="355" width="258" height="80" rx="8"/>
    </clipPath>
    <clipPath id="skill2-clip">
      <rect x="321" y="355" width="258" height="80" rx="8"/>
    </clipPath>
    <clipPath id="skill3-clip">
      <rect x="612" y="355" width="258" height="80" rx="8"/>
    </clipPath>
    <clipPath id="banner-clip">
      <rect x="20" y="450" width="860" height="68" rx="8"/>

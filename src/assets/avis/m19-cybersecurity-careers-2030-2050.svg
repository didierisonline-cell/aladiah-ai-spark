  <circle cx="347" cy="235" r="4" fill="#9B59B6"/>
  <text x="450" y="239" text-anchor="middle" font-size="12" fill="#EDF2F7" font-family="system-ui, -apple-system, sans-serif">Post-Quantum Architect</text>


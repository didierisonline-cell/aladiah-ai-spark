  <rect x="321" y="355" width="3" height="80" fill="#22C98A" clip-path="url(#skill2-clip)"/>
  <text x="450" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF2F7" font-family="system-ui, -apple-system, sans-serif">Domain depth at an intersection</text>
  <text x="450" y="405" text-anchor="middle" font-size="10" fill="#8596AD" font-family="system-ui, -apple-system, sans-serif">AI × your specialty = rare expertise</text>
  <!-- Green icon dot -->
  <circle cx="337" cy="390" r="3" fill="#22C98A"/>

  <!-- Skill Card 3 (x=612, y=355, width=258, height=80) -->
  <rect x="612" y="355" width="258" height="80" rx="8" fill="#081A10" stroke="#22C98A" stroke-width="1.5"/>
  <!-- Green left accent bar -->
  <rect x="612" y="355" width="3" height="80" fill="#22C98A" clip-path="url(#skill3-clip)"/>
  <text x="741" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF2F7" font-family="system-ui, -apple-system, sans-serif">AI governance + technical literacy</text>
  <text x="741" y="405" text-anchor="middle" font-size="10" fill="#8596AD" font-family="system-ui, -apple-system, sans-serif">Bridge the gap most professionals miss</text>
  <!-- Green icon dot -->
  <circle cx="628" cy="390" r="3" fill="#22C98A"/>

  <!-- ═══════════════════════════════════════════════════════════ -->

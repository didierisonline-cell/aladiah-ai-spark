  <circle cx="642" cy="235" r="4" fill="#F59E0B"/>
  <text x="745" y="239" text-anchor="middle" font-size="12" fill="#EDF2F7" font-family="system-ui, -apple-system, sans-serif">Synthetic Identity Specialist</text>


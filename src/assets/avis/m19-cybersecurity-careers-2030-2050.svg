  <circle cx="642" cy="273" r="4" fill="#F59E0B"/>
  <text x="745" y="277" text-anchor="middle" font-size="12" fill="#EDF2F7" font-family="system-ui, -apple-system, sans-serif">AI Security Policy Designer</text>

  <!-- ═══════════════════════════════════════════════════════════ -->

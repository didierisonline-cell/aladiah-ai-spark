  <!-- Role chip 2: AI Risk Manager -->
  <rect x="32" y="220" width="246" height="30" rx="12" fill="#1A2E4A" stroke="#4A90F5" stroke-width="1"/>
  <circle cx="52" cy="235" r="4" fill="#4A90F5"/>
  <text x="155" y="239" text-anchor="middle" font-size="12" fill="#EDF2F7" font-family="system-ui, -apple-system, sans-serif">AI Risk Manager</text>

  <!-- Role chip 3: AI Compliance Officer -->
  <rect x="32" y="258" width="246" height="30" rx="12" fill="#1A2E4A" stroke="#4A90F5" stroke-width="1"/>
  <circle cx="52" cy="273" r="4" fill="#4A90F5"/>
  <text x="155" y="277" text-anchor="middle" font-size="12" fill="#EDF2F7" font-family="system-ui, -apple-system, sans-serif">AI Compliance Officer</text>


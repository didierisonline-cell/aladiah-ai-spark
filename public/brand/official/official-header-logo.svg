<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 132" role="img" aria-label="Aladiah Academy">
  <title>Aladiah Academy</title>
  <defs>
    <linearGradient id="hS" x1="0.10" y1="0" x2="0.40" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.16" stop-color="#E9F0FA"/>
      <stop offset="0.42" stop-color="#AEBED7"/>
      <stop offset="0.58" stop-color="#DCE6F4"/>
      <stop offset="0.80" stop-color="#8497B7"/>
      <stop offset="1" stop-color="#BFCDE3"/>
    </linearGradient>
    <linearGradient id="hSr" x1="0.10" y1="0" x2="0.40" y2="1">
      <stop offset="0" stop-color="#D7E0EF"/>
      <stop offset="0.20" stop-color="#A9B9D3"/>
      <stop offset="0.50" stop-color="#6E82A6"/>
      <stop offset="0.72" stop-color="#9DAFCB"/>
      <stop offset="1" stop-color="#5A6E92"/>
    </linearGradient>
    <linearGradient id="hG" x1="0.10" y1="0" x2="0.22" y2="1">
      <stop offset="0" stop-color="#FFF4CC"/>
      <stop offset="0.28" stop-color="#F7D67E"/>
      <stop offset="0.52" stop-color="#D89B36"/>
      <stop offset="0.72" stop-color="#F3CD72"/>
      <stop offset="1" stop-color="#A9741F"/>
    </linearGradient>
    <linearGradient id="hWord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#D2DCEC"/>
      <stop offset="1" stop-color="#94A6C4"/>
    </linearGradient>
    <radialGradient id="hSpec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="hGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hDepth" x="-30%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.8" flood-color="#0A1322" flood-opacity="0.45"/>
    </filter>
    <filter id="hTxt" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#0A1322" flood-opacity="0.5"/>
    </filter>
    <clipPath id="hGlobe"><path d="M16 99 Q60 117 104 99 L104 120 Q60 134 16 120 Z"/></clipPath>
  </defs>
  <!-- mark -->
  <g clip-path="url(#hGlobe)" fill="#C9A24B" opacity="0.55">
    <circle cx="42" cy="105" r="1.1"/><circle cx="50" cy="103" r="1.1"/><circle cx="58" cy="104" r="1.1"/><circle cx="66" cy="103" r="1.1"/><circle cx="74" cy="105" r="1.1"/><circle cx="46" cy="109" r="1.1"/><circle cx="62" cy="109" r="1.1"/><circle cx="70" cy="110" r="1.1"/>
  </g>
  <path d="M16 99 Q60 117 104 99" stroke="url(#hG)" stroke-width="2.6" fill="none" stroke-linecap="round" filter="url(#hGlow)"/>
  <g filter="url(#hDepth)">
    <polygon points="26,98 56,30 63,32 45,98" fill="url(#hS)"/>
    <polygon points="94,98 64,30 57,32 75,98" fill="url(#hSr)"/>
    <polygon points="56,30 60,31 58,52 56.5,50" fill="#FFFFFF" opacity="0.55"/>
    <polygon points="58,72 62,72 61,96 59,96" fill="url(#hG)"/>
    <ellipse cx="60" cy="37" rx="5.5" ry="9" fill="url(#hSpec)" opacity="0.7"/>
  </g>
  <path d="M58.5 30 C61.5 28.5 64.5 25.5 64.5 20 A5.5 5.5 0 1 0 58.8 14.8" fill="none" stroke="url(#hG)" stroke-width="3.4" stroke-linecap="round" filter="url(#hGlow)"/>
  <!-- wordmark -->
  <text x="150" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="600" letter-spacing="6" fill="url(#hWord)" filter="url(#hTxt)">ALADIAH</text>
  <text x="153" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="13" fill="url(#hG)">ACADEMY</text>
  <text x="153" y="112" font-family="Inter, Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.4" fill="#94A6C4">INTELLIGENCE. PURPOSE. IMPACT.</text>
</svg>

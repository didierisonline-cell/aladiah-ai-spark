<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-label="Aladiah Academy — Full Lockup">
  <title>Aladiah Academy Full Lockup</title>
  <desc>Official full lockup: Primary Mark above wordmark "ALADIAH ACADEMY" and tagline "Intelligence. Purpose. Impact."</desc>

  <defs>
    <!-- Silver-chrome gradient — torch body -->
    <linearGradient id="fl-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4E6480"/>
      <stop offset="28%"  stop-color="#9BAFBF"/>
      <stop offset="55%"  stop-color="#D2E2EE"/>
      <stop offset="78%"  stop-color="#A8BCCF"/>
      <stop offset="100%" stop-color="#4E6480"/>
    </linearGradient>

    <!-- Gold gradient -->
    <linearGradient id="fl-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#EDD878"/>
      <stop offset="45%"  stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8B6218"/>
    </linearGradient>

    <!-- Gold horizontal gradient (for text/divider) -->
    <linearGradient id="fl-gold-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8B6218" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#C9A24B"/>
      <stop offset="50%"  stop-color="#EDD878"/>
      <stop offset="80%"  stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8B6218" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="fl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background radial -->
    <radialGradient id="fl-bg" cx="50%" cy="38%" r="55%">
      <stop offset="0%"   stop-color="#132545"/>
      <stop offset="100%" stop-color="#060E1E"/>
    </radialGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="360" height="340" fill="#0E1F44"/>
  <rect width="360" height="340" fill="url(#fl-bg)" opacity="0.7"/>

  <!-- ── MARK (primary mark, scaled and centered in upper portion) ── -->
  <!-- Translate to center of a 300-wide canvas, scale 0.76 of the 200×200 mark -->
  <g transform="translate(180, 105) scale(0.76)">

    <!-- Torch head -->
    <path d="M -27 -10 L -27 -40 Q -27 -67 0 -69 Q 27 -67 27 -40 L 27 -10 Z"
          fill="url(#fl-silver)"/>

    <!-- Depth lines on head -->
    <line x1="-14" y1="-68" x2="-18" y2="-12" stroke="#1A3050" stroke-width="1.2" opacity="0.22"/>
    <line x1="14"  y1="-68" x2="18"  y2="-12" stroke="#1A3050" stroke-width="1.2" opacity="0.22"/>

    <!-- Panel bands -->
    <rect x="-27" y="-27" width="54" height="2.5" rx="1" fill="#0E1F44" opacity="0.18"/>
    <rect x="-27" y="-19" width="54" height="2"   rx="1" fill="#0E1F44" opacity="0.14"/>

    <!-- Gold collar -->
    <rect x="-18" y="-12" width="36" height="7" rx="3.5" fill="url(#fl-gold)"/>

    <!-- Shaft -->
    <rect x="-9" y="-5" width="18" height="50" rx="2" fill="url(#fl-silver)"/>

    <!-- Mid shaft band -->
    <rect x="-12" y="16" width="24" height="2.5" rx="1" fill="url(#fl-gold)" opacity="0.55"/>

    <!-- Lower collar -->
    <rect x="-13" y="43" width="26" height="4" rx="2" fill="url(#fl-gold)"/>

    <!-- Base flare -->
    <path d="M -19 51 L -13 43 L 13 43 L 19 51 Q 0 57 -19 51 Z" fill="url(#fl-silver)"/>

    <!-- Hidden 9 circle (bowl) -->
    <circle cx="0" cy="-39"
            r="21"
            fill="none"
            stroke="url(#fl-gold)"
            stroke-width="3.8"
            filter="url(#fl-glow)"/>

    <!-- Hidden 9 tail -->
    <path d="M 21 -39 L 21 -12"
          fill="none"
          stroke="url(#fl-gold)"
          stroke-width="3.8"
          stroke-linecap="round"
          filter="url(#fl-glow)"/>

    <!-- Flame tip -->
    <path d="M -7 -67 Q 0 -82 7 -67"
          fill="none"
          stroke="url(#fl-gold)"
          stroke-width="2.4"
          stroke-linecap="round"/>

    <!-- Global arc (primary) -->
    <path d="M -56 55 Q 0 32 56 55"
          fill="none"
          stroke="url(#fl-gold)"
          stroke-width="3.8"
          stroke-linecap="round"
          filter="url(#fl-glow)"/>

    <!-- Global arc (echo) -->
    <path d="M -46 62 Q 0 42 46 62"
          fill="none"
          stroke="url(#fl-gold)"
          stroke-width="1.4"
          stroke-linecap="round"
          opacity="0.38"/>

    <!-- Star accents -->
    <circle cx="-44" cy="30" r="1.4" fill="#C9A24B" opacity="0.45"/>
    <circle cx="44"  cy="30" r="1.4" fill="#C9A24B" opacity="0.45"/>
  </g>

  <!-- ── GOLD DIVIDER ── -->
  <rect x="80" y="195" width="200" height="0.75" fill="url(#fl-gold-h)"/>

  <!-- ── WORDMARK: ALADIAH ACADEMY ── -->
  <!--
    Note: In production, convert to outlined paths in Illustrator/Inkscape.
    Font stack: Trajan Pro → Times New Roman → serif (closest to classic collegiate).
    Letter-spacing set for maximum legibility at all sizes.
  -->
  <text x="180"
        y="225"
        font-family="'Trajan Pro', 'Times New Roman', Georgia, serif"
        font-size="22"
        font-weight="700"
        fill="url(#fl-gold)"
        text-anchor="middle"
        letter-spacing="6.5">ALADIAH ACADEMY</text>

  <!-- ── DIVIDER BELOW WORDMARK ── -->
  <rect x="120" y="235" width="120" height="0.5" fill="url(#fl-gold-h)" opacity="0.5"/>

  <!-- ── TAGLINE ── -->
  <text x="180"
        y="260"
        font-family="'Trajan Pro', 'Times New Roman', Georgia, serif"
        font-size="10.5"
        font-weight="400"
        fill="#C9A24B"
        text-anchor="middle"
        letter-spacing="2.5"
        opacity="0.88">Intelligence. Purpose. Impact.</text>
</svg>
